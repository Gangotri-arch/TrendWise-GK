
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrendWise GK Quiz</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LANGUAGE BUTTONS -->

<div class="lang-buttons">

  <button onclick="translatePage('en')">
    English
  </button>

  <button onclick="translatePage('hi')">
    हिन्दी
  </button>

</div>

<div id="google_translate_element" style="display:none;"></div>

<!-- QUIZ -->

<div class="quiz-box" id="quizBox">

<h3 id="timer" class="notranslate">
  Time Left: 10:00
</h3>

<div class="quiz-layout">

<!-- LEFT -->

<div class="quiz-left">

<h2 id="question"></h2>

<div id="options"></div>

<div class="btn-row">

<button id="prevBtn">
  Previous
</button>

<button id="markBtn">
  Mark
</button>

<button id="nextBtn">
  Next
</button>

<button id="submitBtn">
  Submit
</button>

</div>

</div>

<!-- RIGHT -->

<div class="quiz-right">

<!-- LANGUAGE + PANEL WRAPPER -->
<div class="side-top">

  <div class="lang-buttons">
    <button onclick="translatePage('en')">English</button>
    <button onclick="translatePage('hi')">हिन्दी</button>
  </div>

  <h3 class="notranslate">Questions</h3>

  <div id="qPanel" class="notranslate"></div>

</div>

</div>

</div>

</div>

<!-- SCORE -->

<div id="scoreBox" style="display:none;">

<h1>
Quiz Finished 🎉
</h1>

<h2 id="resultText"></h2>

<h3 id="percentText"></h3>

<div id="reviewBox"></div>

<br><br>

<button onclick="goHome()" id="homeBtn">
Go To Home
</button>

</div>

<script>

const supabaseUrl=
"https://sorwebstkjxtophrbboh.supabase.co";

const supabaseKey=
"sb_publishable_Idq6skWlkQA8FAOS7a6OSg_ltUSaTrE";

const testId=
localStorage.getItem("test_id");

let questions=[];
let current=0;
let answers=[];
let marked=[];
let timer;
let timeLeft=600;

/* LOAD QUESTIONS */

async function loadQuestions(){

const res=await fetch(
`${supabaseUrl}/rest/v1/questions?test_id=eq.${testId}`,
{
headers:{
apikey:supabaseKey,
Authorization:`Bearer ${supabaseKey}`
}
}
);

questions=await res.json();

answers=
new Array(questions.length).fill(null);

createPanel();
showQuestion();
startTimer();

}

/* SHOW QUESTION */

function showQuestion(){

const q=questions[current];

const question=document.getElementById("question");

question.innerText=
`Q${current+1}. ${q.question}`;

const optDiv=
document.getElementById("options");

optDiv.innerHTML="";

const options=[
q.option_a,
q.option_b,
q.option_c,
q.option_d
];

options.forEach((opt,index)=>{

const div=
document.createElement("div");

div.className = "option notranslate";

div.innerHTML=
`<span class="notranslate">${index+1}.</span> ${opt}`;

if(answers[current]===index){

div.style.background="#dbeafe";
div.style.border="2px solid #2563eb";

}

/* SELECT OPTION */

div.onclick=()=>{

answers[current]=index;

updatePanel();

};
optDiv.appendChild(div);

});

updatePanel();

}

/* CREATE PANEL */

function createPanel(){

const panel=
document.getElementById("qPanel");

panel.innerHTML="";

questions.forEach((q,i)=>{

const btn=
document.createElement("button");

btn.innerText=i+1;

btn.className = "panel-btn notranslate";

btn.onclick=()=>{

current=i;
showQuestion();

};

panel.appendChild(btn);

});

}

/* UPDATE PANEL */

function updatePanel(){

const btns=
document.querySelectorAll(".panel-btn");

btns.forEach((b,i)=>{

b.style.background="#e5e7eb";
b.style.color="black";

/* ATTEMPTED */

if(answers[i]!==null){

b.style.background="#86efac";

}

/* MARKED */

if(marked.includes(i)){

b.style.background="#f59e0b";
b.style.color="white";

}

/* CURRENT */

if(i===current){

b.style.background="#111827";
b.style.color="white";

}

});

}

/* NEXT */

document.getElementById("nextBtn").onclick=()=>{

if(current<questions.length-1){

current++;
showQuestion();

}

};

/* PREVIOUS */

document.getElementById("prevBtn").onclick=()=>{

if(current>0){

current--;
showQuestion();

}

};

/* MARK */

document.getElementById("markBtn").onclick=()=>{

if(!marked.includes(current)){

marked.push(current);

}

updatePanel();

};

/* SUBMIT */

document.getElementById("submitBtn").onclick=()=>{

showResult();

};

/* SHOW RESULT */

function showResult(){

clearInterval(timer);

document.getElementById("quizBox")
.style.display="none";

document.getElementById("scoreBox")
.style.display="block";

let correct=0;

questions.forEach((q,i)=>{

const options = [
  q.option_a?.trim(),
  q.option_b?.trim(),
  q.option_c?.trim(),
  q.option_d?.trim()
];

const correctIndex =
options.indexOf(q.correct_answer?.trim());
  

if(answers[i]===correctIndex){

correct++;

}

});

let percent=
(correct/questions.length)*100;

/* SCORE */

document.getElementById("resultText")
.innerText=
`Score: ${correct}/${questions.length}`;

/* PERCENTAGE */

document.getElementById("percentText")
.innerText=
`Percentage: ${percent.toFixed(2)}%`;

/* REVIEW SECTION */

const reviewBox=
document.getElementById("reviewBox");

reviewBox.innerHTML="";

questions.forEach((q,i)=>{

const userAnswer=[
q.option_a,
q.option_b,
q.option_c,
q.option_d
][answers[i]];

const div=
document.createElement("div");

const correctIndex=[
q.option_a,
q.option_b,
q.option_c,
q.option_d
].indexOf(q.correct_answer);

const isCorrect=
answers[i]!==null &&
answers[i]===correctIndex;

div.className="review-card";

div.innerHTML=`

<h3>
Question ${i+1}
</h3>

<p>
<strong>Question:</strong>
${q.question}
</p>

<p>
<strong>Your Answer:</strong>
${userAnswer || "Not Attempted"}
</p>

<p>
<strong>Correct Answer:</strong>
${q.correct_answer}
</p>

<p>
<strong>Status:</strong>
${answers[i]===null
 ? "⚪ Not Attempted"
 : isCorrect
 ? "✅ Correct"
 : "❌ Wrong"}
</p>

<p>
<strong>Explanation:</strong>
${q.explanation || "No explanation available"}
</p>

`;

reviewBox.appendChild(div);

});

}

/* TIMER */

function startTimer(){

timer=setInterval(()=>{

timeLeft--;

let m=Math.floor(timeLeft/60);
let s=timeLeft%60;

if(s<10){
s="0"+s;
}

document.getElementById("timer")
.innerText=
`Time Left: ${m}:${s}`;

if(timeLeft<=0){

showResult();

}

},1000);

}

/* HOME */

function goHome(){

window.location.href=
"index.html";

}

/* GOOGLE TRANSLATE */

function googleTranslateElementInit() {

new google.translate.TranslateElement(
{
pageLanguage: 'en',
includedLanguages: 'en,hi'
},
'google_translate_element'
);

}

function translatePage(lang){

const select=
document.querySelector(".goog-te-combo");

if(select){

select.value=lang;

select.dispatchEvent(
new Event("change")
);

}

}

/* START */

loadQuestions();

</script>

<script
src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
</script>

</body>
</html>
